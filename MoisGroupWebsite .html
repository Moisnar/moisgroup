header{position:fixed;inset:0 0 auto;z-index:20;color:#fff;padding-top:env(safe-area-inset-top,0px);transition:background .3s,box-shadow .3s}
header.s{background:rgba(18,59,255,.96);backdrop-filter:blur(10px);box-shadow:0 1px 0 rgba(255,255,255,.14)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.nav .lg{width:112px;height:30px;color:#fff}
.links{display:flex;gap:26px;font-size:14px}
.links a{opacity:.82;transition:opacity .2s}.links a:hover{opacity:1}
.tools{display:flex;gap:8px;align-items:center}
.pill{width:38px;height:38px;padding:0;display:grid;place-items:center;border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:50%;cursor:pointer}.pill svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.pill:hover{background:#fff;color:var(--c)}
.bg{display:none;width:38px;height:38px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:none;color:#fff;cursor:pointer;font-size:16px}
/* hero */
.hero{background:var(--c);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:calc(64px + env(safe-area-inset-top,0px)) 0 0;min-height:clamp(540px,82svh,780px)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 80% 40%,rgba(255,255,255,.16),transparent 70%)}
.hero .wrap{position:relative;z-index:1;width:100%}

.hero::after{content:"";position:absolute;pointer-events:none;inset-block:64px 0;margin-block:auto;height:min(56%,400px);inset-inline-end:max(20px,calc((100% - 1160px)/2 + 20px));width:min(32%,380px);background:#fff;opacity:.08;-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.hero h1{font-size:clamp(44px,5.6vw,76px);letter-spacing:normal;word-spacing:normal;line-height:1.3;max-width:80%;text-wrap:balance}
html[lang=en] .hero h1{line-height:1.18}
.hero p{margin:24px 0 0;max-width:46ch;font-size:clamp(17px,2vw,22px);line-height:1.8;opacity:.9}
.hm{flex:1;display:flex;align-items:center;justify-content:flex-start;padding-block:clamp(44px,6.5vw,80px)}
.eb{display:inline-block;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:4px 16px;font-size:13px;margin-bottom:26px;animation:up .9s both}
.hf{position:relative;z-index:1;padding-bottom:24px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:40px;animation:up .9s .3s cubic-bezier(.2,.7,.2,1) both}
.btn{display:inline-block;padding:13px 30px;border:1px solid transparent;border-radius:99px;background:#fff;color:var(--c);font-weight:var(--hw);font-size:15px;line-height:1.5;transition:transform .25s,background .25s}
.btn:hover{transform:translateY(-2px)}
.btn.o{background:none;color:#fff;border:1px solid rgba(255,255,255,.55)}.btn.o:hover{background:rgba(255,255,255,.12)}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid rgba(255,255,255,.28);padding-top:16px;font-size:13px}
html[lang=en] .hbar,html[lang=en] .eb{letter-spacing:.1em;text-transform:uppercase}
.sc{display:flex;align-items:center;gap:10px}.sc i{width:1px;height:30px;background:#fff;transform-origin:top;animation:ln 2.4s ease-in-out infinite}
@keyframes ln{0%{transform:scaleY(0);opacity:1}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.hero h1,.hero p{animation:up .9s cubic-bezier(.2,.7,.2,1) both}.hero p{animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes fl{50%{transform:translateY(-12px)}}
/* sections */
section{padding:var(--sec) 0}
.hd{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
h2{font-size:clamp(26px,3.6vw,42px)}
.hd p{color:var(--mut);max-width:40ch}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:18px;padding:28px;background:var(--bg);transition:background .35s,color .35s,transform .35s}
.card svg{width:44px;height:44px;margin-bottom:22px;stroke:var(--c);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.card h3{font-size:22px;margin-bottom:8px}
.card p{color:var(--mut);font-size:15px;transition:color .35s}
.card:hover{background:var(--c);color:#fff;transform:translateY(-4px)}
.card:hover svg{stroke:#fff}.card:hover p{color:rgba(255,255,255,.85)}
.soft{background:var(--soft)}
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;padding:14px;isolation:isolate;background:var(--c)}
.tile svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile:hover svg{transform:scale(1.05)}
.tile b{background:#fff;color:#000;border-radius:99px;padding:3px 13px;font-size:14px;line-height:1.6}
.t4{outline:1px solid var(--line);outline-offset:-1px}
.svc h3{font-size:20px;margin:16px 0 6px}.svc p{color:var(--mut);font-size:15px}
/* about */
.about{background:#000;color:#fff}
.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start}
.about p{color:#C4C8D8;margin-top:16px;max-width:52ch}
.vals{display:grid;gap:0}
.vals div{display:flex;gap:16px;padding:18px 0;border-top:1px solid rgba(255,255,255,.16)}
.vals div:last-child{border-bottom:1px solid rgba(255,255,255,.16)}
.vals b{min-width:112px;color:#7C93FF;font-size:18px}.vals span{color:#C4C8D8;font-size:15px}
/* contact */
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.row{border-inline-start:3px solid var(--c);padding:6px 18px}
.row small{display:block;color:var(--mut);font-size:13px}.row b{font-size:17px}.row b.m{color:var(--mut);font-weight:400}
.row a.em{display:inline-block;unicode-bidi:isolate;color:var(--c);word-break:break-all}.row a.em:hover{text-decoration:underline}
/* founder */
.fnd{display:grid;grid-template-columns:auto 1fr;direction:ltr;gap:clamp(24px,5vw,64px);align-items:center}
html[dir=rtl] .fnd>div:last-child{direction:rtl;text-align:right}
.ph{width:clamp(170px,26vw,290px);aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;padding:16px;overflow:hidden;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{box-shadow:0 0 0 5px var(--soft),0 0 0 7px var(--c)}
.ph .mk{width:70px;height:60px;opacity:.9}.ph small{opacity:.8;font-size:12px;line-height:1.4}
.fnd h2{font-size:clamp(28px,4vw,44px)}
.role{color:var(--c);font-size:17px;margin:4px 0 20px}
:root[data-theme="dark"] .role{color:#7C93FF}
.fnd blockquote{border-inline-start:3px solid var(--c);padding-inline-start:20px;font-size:clamp(16px,2vw,20px);max-width:48ch}
footer{background:#000;color:#9AA0B8;text-align:center;font-size:13px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
footer .soc{display:flex;justify-content:center;gap:14px;margin-top:16px}footer .soc a{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:#fff;transition:background .2s,transform .2s}footer .soc a:hover,footer .soc a:focus-visible{background:var(--c);transform:translateY(-2px)}footer .soc svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* responsive */
@media(max-width:900px){
.links{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 auto;background:var(--bg);color:var(--fg);box-shadow:0 14px 28px rgba(0,0,0,.14);flex-direction:column;gap:0;padding:8px 20px 16px;display:none}
.links.o{display:flex}.links a{padding:13px 0;border-bottom:1px solid var(--line);opacity:1}
.bg{display:block}
.grid3,.rows{grid-template-columns:1fr}
.work{grid-template-columns:repeat(2,1fr)}
.about .wrap{grid-template-columns:1fr}
.hero{min-height:clamp(520px,64svh,640px)}
.cta{margin-top:32px}
.hm{align-items:flex-start;padding-block:64px 56px}.hero p{margin-top:22px}
.hero h1{max-width:100%;font-size:clamp(36px,10.2vw,68px);line-height:1.28}.hero p{max-width:34ch;text-wrap:balance;font-size:clamp(16px,4.2vw,20px)}html[lang=ar] .hero h1{font-size:clamp(40px,11vw,72px)}
.hero::after{width:50%;opacity:.06;inset-block:auto 56px;margin-block:0;height:30%;inset-inline-end:-4%}
}
@media(max-width:520px){.work{gap:22px 10px}.svc h3{font-size:17px}.svc p{font-size:14px}.fnd{grid-template-columns:1fr;justify-items:center}.fnd>div:last-child{width:100%}.ph{width:150px}.ph small{display:none}.tile{padding:14px}.tile b{font-size:15px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
